<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERP & Social Previewer</title>
    <meta name="description" content="Try our SERP & Social Previewer to find out if your meta tags 
    respect Google guidelines.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <section class="header">
            <div class="header-left">
                <i class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></i>
                <div class="title-col">
                    <h1 class="title">SERPscope</h1>
                    <div class="subtitle">SEO & Social preview tool</div>
                    <div class="tags">
                        <div class="tag">SEO</div>
                        <div class="tag">Social</div>
                        <div class="tag">Open Graph</div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button class="light-change-button-row">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon preview-icon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></div>
                    <div class="writing">Midnight Mode</div>
                </button>
            </div>
        </section>

        <section class="main-body">
            <section class="prompt-col">
                <div class="field-container prompt-container">
                    <h2 class="prompt-title">Page details</h2> 
                    
                    <div class="input-field title">
                        <label for="title-input" class="input-field title-tag">Title tag</label>
                        <input type="text" id="title-input" class="input-field input-box" placeholder="Insert your text here">
                        <div class="input-field check">
                            <p class="input-field character-count">0/60 characters</p>
                            <p class="input-field judgement">Optimal</p>
                        </div>
                    </div>

                    <div class="input-field description">
                        <label for="description-input" class="input-field description-tag">Description tag</label>
                        <input type="text" id="description-input" class="input-field input-box" placeholder="Insert your text here">
                        <div class="input-field check">
                            <p class="input-field character-count">0/155 characters</p>
                            <p class="input-field judgement">Optimal</p>
                        </div>
                    </div>

                    <div class="input-field url">
                        <label for="url-input" class="input-field url-tag">Page URL</label>
                        <input type="text" id="url-input" class="input-field input-box">
                    </div>

                    <div class="input-field target-keyword">
                        <label for="keyword-input" class="input-field keyword-tag">Target keyword</label>
                        <input type="text" id="keyword-input" class="input-field input-box">
                    </div>

                    <div class="input-field social-image">
                        <label for="social-input" class="input-field social-tag">Social image URL</label>
                        <input type="text" id="social-input" class="input-field input-box">
                    </div>

                    <div class="preview">
                        <h3 class="preview-title">Preview as</h3>
                        <div class="preview-selector">
                            <button class="desktop-preview">Desktop</button>
                            <button class="mobile-preview">Mobile</button>
                        </div>
                    </div>

                </div>
            </section>
            <section class="results-col">
                <div class="provv"></div>
            </section>
        </section>
    </div>
</body>
</html>
